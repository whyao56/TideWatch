# 抗规避折叠表
#
# 水军规避关键词的手法其实很朴素，但非常有效：
#   - 谐音：加薇信 / 加威信 / 加溦信
#   - 形近字：微 → 徽
#   - 插符号：加·微·信、加-微-信
#   - 夹 emoji：加薇❤️信
#   - 全角：加Ｗｅｉ信（全角字母在 normalize_text 阶段已折半角）
#
# 直接拿原文匹配话术库，召回率会低到没法用。这张表把变体映射回规范字，
# 让「加薇❤️信」能被「加微信」这条话术捞出来。
#
# 加表的原则：**只收同音或形近的字**。
# 不要因为「意思相近」就往上加 —— 那是臆断，会把召回率抬上去、把精确率
# 打下来，最后规则变成玄学。宁可漏，不要滥。
#
# 折叠是有损的：折叠后的文本只用于匹配，绝不用于展示或统计，
# 否则报告里会出现「加薇❤️信」被显示成「加微信」这类误导。

fold:
  # ---- 微（微信 / 私域相关的高频字）----
  薇: 微
  溦: 微
  徽: 微
  嶶: 微

  # ---- 信 ----
  芯: 信
  伩: 信

  # ---- 聊 ----
  辽: 聊
  潦: 聊

  # ---- 码（扫码）----
  玛: 码
  碼: 码

  # ---- Q（QQ 的谐音写法）----
  扣: q
  邱: q
  抠: q

  # ---- 群 ----
  裙: 群

  # ---- 符号类 ----
  # 这些符号在折叠阶段本来就会被丢弃，列在这里是为了把「意图」显式记录下来：
  # 哪天有人想把它们改成别的字，能一眼看到原来是有意为之。
  ➕: 加
  "＋": 加

  # ---- 数字替代：用汉字写手机号 ----
  零: "0"
  幺: "1"
  壹: "1"
  贰: "2"
  叁: "3"
