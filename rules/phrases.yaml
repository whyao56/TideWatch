# 话术库 —— 「可微调」最直接的入口。
#
# 想让它适配你的场景（游戏公屏 / 电商评论 / 社区回帖 / 政务留言），
# 往对应的 groups 里加句子就行，不需要改一行 Python。
#
# weight 的含义：这一组话术本身有多可疑。
#   1.0  强指向性，几乎只出现在水军场景
#   0.8  较强，但正常用户也会偶尔使用
#   0.5  弱，只能作为辅助证据
#
# 这个权重设计是整套规则里最容易搞砸的地方：**弱话术必须配低权重**。
# 把「支持」「学到了」这类词也标成 1.0，精确率会直接崩掉 ——
# 这恰恰是很多人自建词库失败的原因。宁可少收，不要滥收。

groups:
  # ---------------- 导流：指向站外或私域，最强信号 ----------------
  - tag: 导流
    weight: 1.0
    phrases:
      - 加微信
      - 加v信
      - 微信号
      - 私聊我
      - 私信我
      - 详情私信
      - 加我好友
      - 扫码进群
      - 拉你进群
      - 点我头像
      - 主页简介
      - 联系方式在
      - 看我主页

  # ---------------- 刷单刷评：电商与带货场景 ----------------
  - tag: 刷评
    weight: 0.8
    phrases:
      - 已买
      - 已下单
      - 无限回购
      - 良心推荐
      - 闭眼入
      - 无脑冲
      - 好用到哭
      - 强烈安利
      - 家人们冲
      - 亲测有效
      - 用了就知道
      - 谁买谁知道

  # ---------------- 控评模板：结构化的中立评论，多为凑数 ----------------
  - tag: 控评模板
    weight: 0.7
    phrases:
      - 前排
      - 沙发
      - 打卡
      - 支持一下
      - 期待更新
      - 关注了
      - 学到了
      - 收藏了
      - 感谢分享
      - 顶一个
      - 已阅
      - 路过

  # ---------------- 情绪煽动：制造对立或紧迫感 ----------------
  - tag: 情绪煽动
    weight: 0.9
    phrases:
      - 大家都看看
      - 千万别买
      - 都别信
      - 快去冲
      - 再不买就没了
      - 最后一天
      - 仅剩几件
      - 手慢无
      - 求扩散
      - 转发让更多人看到

  # ---------------- 招募：反向线索，招的往往就是水军 ----------------
  # 注意语境：这些词出现在招聘区是正常的，出现在评论区才可疑。
  # 所以权重压到 0.7，且报告里会标注「需结合语境」。
  - tag: 招募
    weight: 0.7
    phrases:
      - 招兼职
      - 日结
      - 一部手机
      - 在家就能做
      - 轻松月入
      - 无门槛
      - 手机操作
      - 时间自由
