name: Release

# 什么时候跑：
#   - 推送 v* tag（例如 v0.0.1）→ 构建并发布 GitHub Release
#   - 手动触发 → 只构建 + 冒烟，把产物存成 CI artifact（用来验证打包链路是好的）
#
# 刻意在 windows-latest 上构建：PyInstaller 不支持跨平台打包，
# 发行包必须和目标平台同源；「在 Linux 上打个 Windows 包」这种事做不了。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 发行包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      # 先跑质量门再打包。反过来的话，一个坏版本会先变成 exe 再被发现，
      # 而发行包一旦被人下载走就收不回来了。
      - name: 静态检查
        run: python -m ruff check src tests scripts eval

      - name: 测试
        run: python -m pytest tests -q

      # 和本地走同一条脚本。两边不一样的话，「CI 是绿的」
      # 就证明不了发给使用者的那个包是好的。
      #
      # 失败时把「停在哪一步、什么版本、什么环境、日志首尾」全部塞进
      # `::error::` 注解。理由是踩出来的：作业日志的下载接口需要仓库权限
      # （403），注解却是公开可读的。第一次跑 v0.0.1 失败时，公开信息只有
      # 一句「Process completed with exit code 1.」——排错不该靠猜。
      # 脚本里那几行 `[stage]` 标记就是为这段服务的：光看尾部就知道死在哪。
      - name: 构建发行包（含对产物的冒烟检查）
        shell: pwsh
        run: |
          # 这两行是在**覆盖** runner 的预置值。GitHub 会给每个 pwsh 步骤自动
          # 加一句 `$ErrorActionPreference = 'stop'`；一旦原生命令非零退出，
          # 整步当场中断，下面的诊断块根本没机会跑 —— 而「把失败原因捞出来」
          # 正是那个块存在的唯一理由。所以这里显式改成「不中断、自己读
          # $LASTEXITCODE」，语义与构建脚本在本机验证时用的 bash 一致。
          $ErrorActionPreference = 'Continue'
          if ((Test-Path -LiteralPath variable:\PSNativeCommandUseErrorActionPreference)) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $log = python scripts/build_exe.py --verify-reproducible 2>&1 | Out-String -Stream
          $code = $LASTEXITCODE
          $log | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $snap = python -c "import sys,platform;print('py='+sys.version.split()[0]);print('exe='+sys.executable);print('plat='+platform.platform())"
            $pi = (python -m pip show pyinstaller 2>&1 | Select-String '^Version:').Line
            $pack = (Get-ChildItem packaging -Name) -join ','
            $data = (Get-ChildItem data -Recurse -File -Name) -join ','
            $dist = if (Test-Path dist) { (Get-ChildItem dist -Recurse -File -Name | Select-Object -First 40) -join ',' } else { '<没有 dist>' }
            $head = (($log | Select-Object -First 8) -join ' ~~ ')
            $tail = (($log | Select-Object -Last 40) -join ' ~~ ')
            $msg = @(
              "exit=$code",
              "checkout=${{ github.sha }}",
              ($snap -join ' ; '),
              $pi,
              "packaging=[$pack]",
              "data=[$data]",
              "dist=[$dist]",
              "HEAD: $head",
              "TAIL: $tail"
            ) -join ' | '
            Write-Output "::error::$msg"
            exit $code
          }

      - name: 核对版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Select-String -Path src/tidewatch/version.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $pkg) {
            Write-Error "tag ($tag) 和包内版本 ($pkg) 不一致 —— 发布出来的包会被贴上错误的版本号"
            exit 1
          }
          Write-Output "版本一致：$pkg"

      - name: 存成 CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TideWatch-win64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      # 发行说明写在仓库里（docs/release-notes/v0.0.1.md），而不是只手打一遍。
      # 手打的那份三个月后没人找得到，仓库里的这份能被 review、能改。
      # 缺文件时自动生成一份兜底，免得「忘了写说明」直接让发布失败。
      - name: 准备发行说明
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $file = "docs/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $file)) {
            New-Item -ItemType Directory -Force -Path "docs/release-notes" | Out-Null
            "本版内容见提交记录。" | Out-File -Encoding utf8 $file
          }
          Write-Output "发行说明：$file"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body_path: docs/release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: false
